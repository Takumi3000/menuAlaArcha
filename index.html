<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню — ЦО Хан-Теңири</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-light: #e0f2fe;
            --accent-green: #10b981;
            --accent-green-bg: #ecfdf5;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Top Bar & Language Selector */
        .top-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .lang-switch {
            display: flex;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 20px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
            border-bottom: 1px solid #bae6fd;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin-bottom: 10px;
            background: var(--accent-green-bg);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-size: 2rem;
            border: 2px solid #a7f3d0;
        }

        header h1 {
            color: #0369a1;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* Controls */
        .controls {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 25px;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .cat-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .cat-btn:hover:not(.active) {
            background: var(--primary-light);
            color: var(--primary);
        }

        /* Menu Grid */
        .menu-grid {
            max-width: 950px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.3;
        }

        .price-badge {
            background: var(--accent-green-bg);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid #a7f3d0;
        }

        .desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

        function renderCategories() {
            const container = document.getElementById('catContainer');
            const cats = i18n[currentLang].cats;
            container.innerHTML = '';

            Object.keys(cats).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${key === currentCat ? 'active' : ''}`;
                btn.innerText = cats[key];
                btn.onclick = () => {
                    currentCat = key;
                    renderCategories();
                    renderMenu();
                };
                container.appendChild(btn);
            });
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const langData = i18n[currentLang];
            grid.innerHTML = '';

            const filtered = menuItems.filter(item => {
                const matchCat = (currentCat === 'all' || item.cat === currentCat);
                const text = item[currentLang];
                const matchSearch = text.name.toLowerCase().includes(searchVal) || text.desc.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted); padding: 40px 0;">Ничего не найдено / Эч нерсе табылган жок</p>`;
                return;
            }

            filtered.forEach(item => {
                const text = item[currentLang];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.img}" class="card-img" alt="${text.name}" loading="lazy">
                    <div class="card-body">
                        <div>
                            <div class="card-header">
                                <div class="card-title">${text.name}</div>
                                <div class="price-badge">${item.price} ${langData.currency}</div>
                            </div>
                            <div class="desc">${text.desc}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setLanguage(lang, btn) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const t = i18n[lang];
            document.getElementById('headerSubtitle').innerText = t.subtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('footerText').innerText = t.footer;

            renderCategories();
            renderMenu();
        }

        function filterMenu() {
            renderMenu();
        }

        // Инициализация
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
